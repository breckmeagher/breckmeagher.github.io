<!DOCTYPE html>
<html lang="en" data-theme="dark-poole">
  {% include head.html %}

  <body>
    <div class="container content">
      <header class="masthead">
        <div class="masthead-inner" style="display: flex; justify-content: space-between; align-items: center;">
          <!-- Site title -->
          <h3 class="masthead-title" style="margin: 0;">
            <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
          </h3>

          <!-- Navigation -->
          <nav class="nav">
            <small>
              <a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active{% endif %}">Home</a>
            </small>

            {% for nav in site.nav %}
              <small>
                <a href="{{ nav.url }}" class="{% if page.url == nav.url or page.url contains nav.url %}active{% endif %}">
                 {{ nav.title }}
                </a>
              </small>
            {% endfor %}
          </nav>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="footer">
        <small>
          &copy;
          <time datetime="{{ site.time | date_to_xmlschema }}"
            >{{ site.time | date: '%Y' }}</time
          >. All rights reserved.
        </small>
      </footer>
    </div>

    {% if site.ga_analytics %}
    <script>
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga"
      );
      ga("create", "{{ site.ga_analytics }}", "auto");
      ga("send", "pageview");
    </script>
    {% endif %}
  </body>
</html>
